name: Telegram Cloud Reminder Cron

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions schedule interval)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  trigger-reminders:
    name: Check & Fire Due Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Run tgcloud Cron
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npx tgcloud run endpoints/cron
